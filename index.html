<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiger Antennas — Invoice Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; color: #222; }
  #app { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #1a1a1a; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #444; }
  .field input, .field textarea { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fafafa; }
  .field textarea { min-height: 60px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .line-header { display: none; }
  .line-item { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 6px 8px; align-items: center; margin-bottom: 12px; border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fafafa; }
  .line-item input { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 100%; background: #fff; }
  .line-item input[data-role="desc"] { grid-column: 1 / -1; }
  .line-item input[data-role="qty"] { text-align: right; }
  .line-item input[data-role="price"] { text-align: right; }
  .line-item .del-line { grid-column: 2; justify-self: end; }
  .line-item-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; padding: 0 10px; margin-bottom: 2px; }
  .line-item-labels span { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.04em; text-align: right; }
  .line-item-labels span:first-child { text-align: left; }

  @media (min-width: 520px) {
    .line-header { display: grid; grid-template-columns: 1fr 70px 90px 32px; gap: 8px; font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; padding: 0 2px; }
    .line-item-labels { display: none; }
    .line-item { grid-template-columns: 1fr 70px 90px 32px; grid-template-rows: auto; border: none; border-radius: 0; padding: 0; background: transparent; margin-bottom: 8px; }
    .line-item input[data-role="desc"] { grid-column: auto; }
    .line-item .del-line { grid-column: auto; justify-self: auto; }
  }
  .del-line { background: none; border: none; font-size: 20px; color: #ccc; cursor: pointer; width: 32px; text-align: center; line-height: 1; }
  .del-line:hover { color: #e55; }
  #add-line { background: none; border: 1px dashed #bbb; border-radius: 6px; padding: 8px; width: 100%; font-size: 13px; color: #888; cursor: pointer; margin-top: 4px; }
  #add-line:hover { border-color: #e07b00; color: #e07b00; }
  .total-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px; font-size: 15px; font-weight: 600; }
  .total-row span { color: #e07b00; font-weight: 800; }
  .gst-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; font-size: 13px; color: #888; align-items: center; }
  .gst-row label { cursor: pointer; }

  .btn-row { display: flex; gap: 12px; margin-top: 8px; }
  .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #e07b00; color: #fff; }
  .btn-primary:hover { background: #c96d00; }
  .btn-secondary { background: #eee; color: #555; }
  .btn-secondary:hover { background: #ddd; }

  .pay-btn { padding: 12px; border-radius: 8px; border: 2px solid #ddd; background: #fafafa; font-size: 14px; font-weight: 600; color: #555; cursor: pointer; transition: all 0.15s; }
  .pay-btn:hover { border-color: #e07b00; color: #e07b00; }
  .pay-btn.selected { border-color: #e07b00; background: #fdf5ec; color: #e07b00; }

  /* Invoice preview */
  #preview-wrap { display: none; max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }
  .back-btn { background: none; border: none; font-size: 14px; color: #e07b00; cursor: pointer; margin: 16px 0 12px; font-weight: 600; }
  .back-btn:hover { color: #c96d00; }
  #invoice { background: #fff; border-radius: 10px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  .inv-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
  .inv-logo { width: 85px; }
  .inv-biz { text-align: right; }
  .inv-biz h2 { font-size: 20px; font-weight: 800; color: #e07b00; margin-bottom: 6px; }
  .inv-biz p { font-size: 12px; color: #555; line-height: 1.7; }
  .inv-divider { border: none; border-top: 2.5px solid #e07b00; margin-bottom: 0; }
  .inv-title-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; margin-bottom: 24px; }
  .inv-title-row h1 { font-size: 22px; font-weight: 800; color: #1a1a1a; }
  .inv-meta p { font-size: 12px; color: #555; line-height: 1.9; text-align: right; }
  .inv-meta strong { color: #222; }
  .inv-to { margin-bottom: 24px; }
  .inv-to-label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
  .inv-to p { font-size: 13px; color: #333; line-height: 1.6; white-space: pre-line; }
  table.items { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.items thead th { background: #e07b00; color: #fff; padding: 9px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; text-align: left; }
  table.items thead th.r { text-align: right; }
  table.items tbody tr:nth-child(even) { background: #fdf5ec; }
  table.items tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0e8de; }
  table.items tbody td.r { text-align: right; }
  .inv-totals { display: flex; justify-content: flex-end; margin-bottom: 24px; }
  table.totals { border-collapse: collapse; min-width: 200px; }
  table.totals td { padding: 4px 12px; font-size: 13px; }
  table.totals tr.subtotal td { color: #666; }
  table.totals tr.gst-line td { color: #666; border-bottom: 1px solid #eee; }
  table.totals tr.grand td { font-size: 17px; font-weight: 800; color: #e07b00; border-top: 2px solid #e07b00; padding-top: 8px; }
  table.totals td.r { text-align: right; }
  .inv-payment { background: #fdf5ec; border-radius: 8px; padding: 14px 18px; margin-bottom: 24px; border-left: 4px solid #e07b00; }
  .inv-payment-label { font-size: 12px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .inv-payment p { font-size: 16px; color: #222; line-height: 2.1; }
  .inv-notes { font-size: 12px; color: #555; background: #f9f9f9; border-radius: 6px; padding: 10px 14px; border-left: 3px solid #e07b00; margin-bottom: 20px; }
  .inv-footer { text-align: center; font-size: 13px; color: #e07b00; font-weight: 700; border-top: 1px solid #eee; padding-top: 16px; letter-spacing: 0.02em; }
  .print-btn-row { display: flex; gap: 12px; margin-top: 16px; }

  @media print {
    #app, .back-btn, .print-btn-row { display: none !important; }
    #preview-wrap { display: block !important; padding: 0; }
    #invoice { box-shadow: none; border-radius: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<div id="app">
  <h1>🐯 Tiger Antennas</h1>
  <p class="subtitle">Invoice Generator — fill in the details below</p>

  <div class="card">
    <h2>Customer Details</h2>
    <div class="field"><label>Customer Name</label><input id="cust-name" placeholder="e.g. John Smith"></div>
    <div class="field"><label>Customer Address</label><textarea id="cust-addr" placeholder="Street, Suburb, State, Postcode"></textarea></div>
    <div class="row2">
      <div class="field"><label>Customer Phone (optional)</label><input id="cust-phone" placeholder="e.g. 0400 000 000"></div>
      <div class="field"><label>Customer Email (optional)</label><input id="cust-email" type="email" placeholder="e.g. john@email.com"></div>
    </div>
  </div>

  <div class="card">
    <h2>Invoice Details</h2>
    <div class="row2">
      <div class="field"><label>Invoice Number</label><input id="inv-num" placeholder="e.g. 0042"></div>
      <div class="field"><label>Invoice Date</label><input id="inv-date" type="date"></div>
    </div>
    <div class="field"><label>Due Date (optional)</label><input id="due-date" type="date"></div>
  </div>

  <div class="card">
    <h2>Line Items</h2>
    <div class="line-header">
      <span>Description</span><span style="text-align:right">Qty</span><span style="text-align:right">Unit Price</span><span></span>
    </div>
    <div id="lines-labels" class="line-item-labels"><span>Qty</span><span>Unit Price</span></div>
    <div id="lines"><div class="line-item" data-id="1"><input type="text" placeholder="Description" data-role="desc"><input type="number" placeholder="Qty" min="0" step="any" data-role="qty" style="text-align: right;"><input type="number" placeholder="Price" min="0" step="0.01" data-role="price" style="text-align: right;"><button class="del-line">×</button></div></div>
    <button id="add-line">+ Add line item</button>
    <div class="gst-row">
      <input type="checkbox" id="gst-toggle">
      <label for="gst-toggle">Include GST (10%)</label>
    </div>
    <div class="total-row">Total: <span id="form-total">$0.00</span></div>
  </div>

  <div class="card">
    <h2>Payment Method</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" id="pay-options">
      <button type="button" class="pay-btn" data-method="Cash" onclick="selectPayment(this)">💵 Cash</button>
      <button type="button" class="pay-btn" data-method="Bank Transfer" onclick="selectPayment(this)">🏦 Bank Transfer</button>
      <button type="button" class="pay-btn" data-method="Visa" onclick="selectPayment(this)">💳 Visa</button>
      <button type="button" class="pay-btn" data-method="PayID" onclick="selectPayment(this)">📱 PayID</button>
    </div>
  </div>

  <div class="card">
    <h2>Notes (optional)</h2>
    <div class="field"><textarea id="notes" placeholder="e.g. Warranty: 12 months on all parts and labour"></textarea></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="generateInvoice()">Generate Invoice</button>
    <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
  </div>
</div>

<div id="preview-wrap">
  <button class="back-btn" onclick="goBack()">← Edit Invoice</button>
  <div id="invoice"></div>
  <div class="print-btn-row">
    <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save as PDF</button>
    <button class="btn btn-secondary" onclick="goBack()">← Edit</button>
  </div>
</div>

document.getElementById('inv-date').value = new Date().toISOString().slice(0,10);

let selectedPayment = '';
let lineId = 0;

function selectPayment(btn) {
  document.querySelectorAll('.pay-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  selectedPayment = btn.dataset.method;
}

function addLine(desc, qty, price) {
  lineId++;
  const id = lineId;
  const div = document.createElement('div');
  div.className = 'line-item';
  div.dataset.id = id;

  const iDesc = document.createElement('input');
  iDesc.type = 'text';
  iDesc.placeholder = 'Description';
  iDesc.dataset.role = 'desc';
  iDesc.value = desc || '';
  iDesc.addEventListener('input', calcTotal);

  const iQty = document.createElement('input');
  iQty.type = 'number';
  iQty.placeholder = 'Qty';
  iQty.min = '0';
  iQty.step = 'any';
  iQty.dataset.role = 'qty';
  iQty.value = (qty !== undefined && qty !== '') ? qty : '1';
  iQty.style.textAlign = 'right';
  iQty.addEventListener('input', calcTotal);

  const iPrice = document.createElement('input');
  iPrice.type = 'number';
  iPrice.placeholder = 'Price';
  iPrice.min = '0';
  iPrice.step = '0.01';
  iPrice.dataset.role = 'price';
  iPrice.value = price !== undefined ? price : '';
  iPrice.style.textAlign = 'right';
  iPrice.addEventListener('input', calcTotal);

  const delBtn = document.createElement('button');
  delBtn.className = 'del-line';
  delBtn.innerHTML = '&times;';
  delBtn.addEventListener('click', function() {
    div.remove();
    calcTotal();
  });

  div.appendChild(iDesc);
  div.appendChild(iQty);
  div.appendChild(iPrice);
  div.appendChild(delBtn);
  document.getElementById('lines').appendChild(div);
  calcTotal();
}

function getLineItems() {
  const items = [];
  document.querySelectorAll('#lines .line-item').forEach(function(row) {
    const desc = row.querySelector('[data-role="desc"]').value.trim();
    const qty  = parseFloat(row.querySelector('[data-role="qty"]').value) || 0;
    const price = parseFloat(row.querySelector('[data-role="price"]').value) || 0;
    items.push({ desc, qty, price, subtotal: qty * price });
  });
  return items;
}

function calcTotal() {
  const subtotal = getLineItems().reduce(function(sum, item) { return sum + item.subtotal; }, 0);
  const gstEnabled = document.getElementById('gst-toggle').checked;
  const total = gstEnabled ? subtotal * 1.1 : subtotal;
  document.getElementById('form-total').textContent = '$' + total.toFixed(2);
}

document.getElementById('add-line').addEventListener('click', function() { addLine(); });
document.getElementById('gst-toggle').addEventListener('change', calcTotal);

// Start with one blank line — no duplicates
addLine('', 1, '');

function fmt(n) { return '$' + n.toFixed(2); }
function fmtDate(str) {
  if (!str) return '';
  var p = str.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function generateInvoice() {
  var custName  = document.getElementById('cust-name').value.trim();
  var custAddr  = document.getElementById('cust-addr').value.trim();
  var custPhone = document.getElementById('cust-phone').value.trim();
  var custEmail = document.getElementById('cust-email').value.trim();
  var invNum    = document.getElementById('inv-num').value.trim() || '—';
  var invDate   = document.getElementById('inv-date').value;
  var dueDate   = document.getElementById('due-date').value;
  var notes     = document.getElementById('notes').value.trim();
  var gstEnabled = document.getElementById('gst-toggle').checked;

  if (!custName) { alert('Please enter the customer name.'); return; }
  if (!selectedPayment) { alert('Please select a payment method.'); return; }

  var items = getLineItems().filter(function(i) { return i.desc; });
  if (!items.length) { alert('Please add at least one line item with a description.'); return; }

  var subtotal = items.reduce(function(s,i){ return s + i.subtotal; }, 0);
  var gstAmount = gstEnabled ? subtotal * 0.1 : 0;
  var total = subtotal + gstAmount;

  var rows = items.map(function(i) {
    return '<tr><td>' + i.desc + '</td><td class="r">' + i.qty + '</td><td class="r">' + fmt(i.price) + '</td><td class="r">' + fmt(i.subtotal) + '</td></tr>';
  }).join('');

  var billParts = [custName];
  if (custAddr) billParts.push(custAddr);
  if (custPhone) billParts.push('📞 ' + custPhone);
  if (custEmail) billParts.push('✉ ' + custEmail);
  var billTo = billParts.join('\n');

  var totalsRows = '';
  if (gstEnabled) {
    totalsRows += '<tr class="subtotal"><td>Subtotal</td><td class="r">' + fmt(subtotal) + '</td></tr>';
    totalsRows += '<tr class="gst-line"><td>GST (10%)</td><td class="r">' + fmt(gstAmount) + '</td></tr>';
  }
  totalsRows += '<tr class="grand"><td>TOTAL</td><td class="r">' + fmt(total) + '</td></tr>';

  var paymentDetails = '<p><strong>' + selectedPayment + '</strong>';
  if (selectedPayment === 'Bank Transfer') {
    paymentDetails += '<br><br><strong>Account Name:</strong> Tiger Antennas<br><strong>BSB:</strong> 112-879<br><strong>Account Number:</strong> 4202 600 44';
  } else if (selectedPayment === 'PayID') {
    paymentDetails += '<br><br><strong>PayID (Phone):</strong> 0416 099 186';
  }
  paymentDetails += '</p>';

  var notesBlock = notes ? '<div class="inv-notes"><strong>Notes:</strong> ' + notes + '</div>' : '';

  document.getElementById('invoice').innerHTML =
    '<div class="inv-header">' +
      '<img class="inv-logo" src="data:image/png;base64,' + LOGO + '" alt="Tiger Antennas">' +
      '<div class="inv-biz">' +
        '<h2>Tiger Antennas</h2>' +
        '<p>P.O Box 1892, Westfield Hornsby NSW 1635<br>📞 0416 099 186<br>✉ tony@tigerantennas.com.au</p>' +
      '</div>' +
    '</div>' +
    '<hr class="inv-divider">' +
    '<div class="inv-title-row">' +
      '<h1>INVOICE</h1>' +
      '<div class="inv-meta">' +
        '<p><strong>Invoice #:</strong> ' + invNum + '<br><strong>Date:</strong> ' + fmtDate(invDate) + (dueDate ? '<br><strong>Due:</strong> ' + fmtDate(dueDate) : '') + '</p>' +
      '</div>' +
    '</div>' +
    '<div class="inv-to"><div class="inv-to-label">Bill To</div><p>' + billTo + '</p></div>' +
    '<table class="items"><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit Price</th><th class="r">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="inv-totals"><table class="totals">' + totalsRows + '</table></div>' +
    '<div class="inv-payment"><div class="inv-payment-label">Payment Method</div>' + paymentDetails + '</div>' +
    notesBlock +
    '<div class="inv-footer">Thank you for using Tiger Antennas 🐯</div>';

  document.getElementById('app').style.display = 'none';
  document.getElementById('preview-wrap').style.display = 'block';
  window.scrollTo(0,0);

  // Log to Google Sheets
  var lineItemsSummary = items.map(function(i) {
    return i.desc + ' x' + i.qty + ' @ $' + i.price.toFixed(2);
  }).join(' | ');

  var payload = {
    invoiceNum: invNum,
    invoiceDate: fmtDate(invDate),
    customerName: custName,
    customerAddress: custAddr,
    customerPhone: custPhone,
    customerEmail: custEmail,
    paymentMethod: selectedPayment,
    lineItems: lineItemsSummary,
    subtotal: fmt(subtotal),
    gst: fmt(gstAmount),
    total: fmt(total),
    notes: notes
  };

  fetch('https://script.google.com/macros/s/AKfycbyCtRZf3P45VA2mHGLjxSOrR_2ajaaXIEOzSR40hYWeCElXkzncuB91iDCKgDeHrke2/exec', {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(function(err) {
    console.warn('Could not log to Google Sheets:', err);
  });
}

function goBack() {
  document.getElementById('app').style.display = 'block';
  document.getElementById('preview-wrap').style.display = 'none';
}

function resetForm() {
  if (!confirm('Reset all fields?')) return;
  ['cust-name','cust-addr','cust-phone','cust-email','inv-num','due-date','notes'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('inv-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('lines').innerHTML = '';
  document.querySelectorAll('.pay-btn').forEach(function(b) { b.classList.remove('selected'); });
  document.getElementById('gst-toggle').checked = false;
  selectedPayment = '';
  lineId = 0;
  addLine('', 1, '');
}
</script>
